name: Publish Extension to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Extension
        run: npm run build

      - name: Publish to VS Code Marketplace
        run: |
          TOKEN="${{ secrets.VSCE_PAT || secrets.VS_MARKETPLACE_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Marketplace Personal Access Token is missing! Please set secret 'VSCE_PAT' or 'VS_MARKETPLACE_TOKEN' in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx vsce publish --no-dependencies -p "$TOKEN"
