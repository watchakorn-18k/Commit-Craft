<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="grad-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Git Commit Branch Paths -->
  <path d="M16 48 C 16 32, 48 32, 48 16" fill="none" stroke="url(#grad-main)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M16 16 L 16 48" fill="none" stroke="url(#grad-main)" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 16 L 48 48" fill="none" stroke="url(#grad-main)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Left Bottom Commit Node -->
  <circle cx="16" cy="48" r="6" fill="#0F172A" stroke="url(#grad-main)" stroke-width="3"/>
  <circle cx="16" cy="48" r="2.5" fill="#00F0FF"/>

  <!-- Left Top Commit Node -->
  <circle cx="16" cy="16" r="6" fill="#0F172A" stroke="url(#grad-main)" stroke-width="3"/>
  <circle cx="16" cy="16" r="2.5" fill="#00E599"/>

  <!-- Right Top Target Node -->
  <circle cx="48" cy="16" r="6" fill="#0F172A" stroke="url(#grad-main)" stroke-width="3"/>
  <circle cx="48" cy="16" r="2.5" fill="#C084FC"/>

  <!-- Central AI Sparkle Burst -->
  <g transform="translate(32, 32)">
    <path d="M0 -9 Q 0 0, -9 0 Q 0 0, 0 9 Q 0 0, 9 0 Q 0 0, 0 -9 Z" fill="url(#grad-sparkle)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Sparkles -->
  <path d="M46 38 Q 46 42, 42 42 Q 46 42, 46 46 Q 46 42, 50 42 Q 46 42, 46 38 Z" fill="#38BDF8" opacity="0.9"/>
  <path d="M22 28 Q 22 30, 20 30 Q 22 30, 22 32 Q 22 30, 24 30 Q 22 30, 22 28 Z" fill="#00E599" opacity="0.8"/>
</svg>